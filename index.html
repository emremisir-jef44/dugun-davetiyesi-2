<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Düğün Davetiyesi</title>
    
    <!-- Zarif bir Google Font ekliyoruz -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* --- GENEL AYARLAR --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Cormorant Garamond', serif;
            background-color: #faf9f6; /* Davetiyenin arka plan rengi (krem/bej) */
            overflow-x: hidden;
        }

        /* --- GİRİŞ EKRANI (OVERLAY) AYARLARI --- */
        #giris-ekrani {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000; /* Videonun arka planıyla bütünleşmesi için siyah */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999; /* En üstte durmasını sağlar */
            cursor: pointer; /* Tıklanabilir olduğunu belli eder */
            
            /* Yavaşça kaybolma efekti (1.5 saniye sürer) */
            transition: opacity 1.5s ease-in-out, visibility 1.5s ease-in-out;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 500px; /* Mobil uyumlu, çok büyümesini engeller */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #zarf-video {
            width: 100%;
            height: auto;
            /* playsinline özelliği iOS cihazlarda videonun tam ekrana fırlamasını engeller */
        }

        /* --- ZARFI AÇINIZ YAZISI --- */
        #acilis-metni {
            position: absolute;
            bottom: 20%; /* Videonun alt kısmına konumlandırır */
            color: #ffffff;
            text-align: center;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8); /* Yazının videonun üzerinde okunabilmesi için gölge */
            
            /* Nefes alma (yanıp sönme) animasyonu */
            animation: pulse 2s infinite ease-in-out;
        }

        #acilis-metni p {
            font-size: 1.8rem;
            margin: 0;
            letter-spacing: 3px;
        }

        @keyframes pulse {
            0% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.6; transform: scale(1); }
        }

        /* Video bitince eklenecek kaybolma class'ı */
        .fade-out {
            opacity: 0 !important;
            visibility: hidden !important;
        }

        /* --- ANA DAVETİYE İÇERİĞİ --- */
        #ana-icerik {
            padding: 50px 20px;
            text-align: center;
            /* Başlangıçta giriş ekranının arkasında durur, ekran kaybolunca ortaya çıkar */
        }

        h1 {
            font-size: 2.5rem;
            color: #333;
        }
    </style>
</head>
<body>

    <!-- 1. Aşama: Tıklanabilir Zarf Giriş Ekranı -->
    <div id="giris-ekrani">
        <div class="video-container">
            <!-- Videoyu klasöründen çekiyoruz -->
            <video id="zarf-video" playsinline>
                <source src="images/giris-zarf-2.mp4" type="video/mp4">
                Tarayıcınız video oynatmayı desteklemiyor.
            </video>
            
            <div id="acilis-metni">
                <p>Zarfı açınız</p>
            </div>
        </div>
    </div>

    <!-- 2. Aşama: Zarf Açıldıktan Sonra Gelecek Ana Site İçeriği -->
    <div id="ana-icerik">
        <h1>Hikayemiz Başlıyor...</h1>
        <p>Davetiye detayları, tarih, mekan ve diğer tüm bilgiler buraya gelecek.</p>
        <!-- Diğer site kodlarını buraya eklemeye devam edebilirsin -->
    </div>

    <!-- JavaScript: Tıklama ve Geçiş Mantığı -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const girisEkrani = document.getElementById("giris-ekrani");
            const zarfVideo = document.getElementById("zarf-video");
            const acilisMetni = document.getElementById("acilis-metni");
            let isVideoPlayed = false;

            // Ekranın herhangi bir yerine tıklandığında çalışır
            girisEkrani.addEventListener("click", function() {
                if (!isVideoPlayed) {
                    isVideoPlayed = true;
                    
                    // 1. Zarfı açınız yazısını gizle
                    acilisMetni.style.display = "none";
                    
                    // 2. Videoyu oynat
                    zarfVideo.play();
                }
            });

            // Video tamamen bittiğinde ("ended" eventi) çalışır
            zarfVideo.addEventListener("ended", function() {
                
                // 3. Giriş ekranına yavaşça kaybolma (fade-out) efektini ekle
                girisEkrani.classList.add("fade-out");
                
                // 4. Animasyon bittikten (1.5 sn) sonra arka planda tıklamayı engellememesi için tamamen yok et
                setTimeout(() => {
                    girisEkrani.style.display = "none";
                }, 1500); 
            });
        });
    </script>

</body>
</html>
