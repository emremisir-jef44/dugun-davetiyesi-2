<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Düğün Davetiyesi</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* --- GENEL AYARLAR --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Cormorant Garamond', serif;
            background-color: #faf9f6; 
            overflow-x: hidden;
        }

        /* --- GİRİŞ EKRANI (TAM EKRAN VİDEO VE TIKLAMA ALANI) --- */
        #giris-ekrani {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #e5ded5; /* Siyah ekran yerine zarfın krem tonlarında bir arka plan */
            z-index: 9999;
            cursor: pointer;
            
            /* Yavaşça kaybolma efekti (1.5 saniye) */
            transition: opacity 1.5s ease-in-out, visibility 1.5s ease-in-out;
            
            /* İçindeki metni ortalayıp alta hizalamak için flex kullanıyoruz */
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Yazıyı aşağı atar */
        }

        /* Videonun ekranı tamamen kaplamasını sağlayan ayar */
        #zarf-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Siyah boşluk bırakmaz, ekranı zarfla doldurur */
            z-index: 1; /* Yazının arkasında kalması için */
        }

        /* --- EKRANA TIKLAYINIZ YAZISI --- */
        #acilis-metni {
            position: relative;
            z-index: 2; /* Videonun üstünde kalır */
            color: #333333; /* Krem zarfın üzerinde okunacak koyu zarif bir gri */
            margin-bottom: 15vh; /* Ekranın altından %15 yukarıda durur */
            text-align: center;
            letter-spacing: 2px;
            font-size: 1.5rem;
            
            /* Nefes alma (yanıp sönme) animasyonu */
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        /* Video bitince eklenecek kaybolma class'ı */
        .fade-out {
            opacity: 0 !important;
            visibility: hidden !important;
        }

        /* --- ANA DAVETİYE İÇERİĞİ --- */
        #ana-icerik {
            padding: 50px 20px;
            text-align: center;
            /* Giriş ekranı silinince burası zaten görünür olacak */
        }
    </style>
</head>
<body>

    <!-- 1. Aşama: Tam Ekran Zarf Videolu Giriş -->
    <div id="giris-ekrani">
        <!-- 
          preload="auto" ilk karenin yüklenmesini sağlar.
          #t=0.001 taktiği iOS/Safari'de ilk karenin ekranda poster gibi kalmasını garantiler.
        -->
        <video id="zarf-video" playsinline preload="auto">
            <source src="images/giris-zarf-2.mp4#t=0.001" type="video/mp4">
        </video>
        
        <div id="acilis-metni">Ekrana tıklayınız</div>
    </div>

    <!-- 2. Aşama: Video Bitince Gelecek Asıl Site -->
    <div id="ana-icerik">
        <h1>Hoş Geldiniz...</h1>
        <p>Asıl davetiye tasarımın ve detaylar burada yer alacak.</p>
    </div>

    <!-- JavaScript: Oynatma ve Geçiş Kontrolü -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const girisEkrani = document.getElementById("giris-ekrani");
            const zarfVideo = document.getElementById("zarf-video");
            const acilisMetni = document.getElementById("acilis-metni");
            let isVideoPlayed = false;

            // Ekrana tıklandığında...
            girisEkrani.addEventListener("click", function() {
                if (!isVideoPlayed) {
                    isVideoPlayed = true;
                    
                    // 1. "Ekrana tıklayınız" yazısını hemen yok et
                    acilisMetni.style.display = "none";
                    
                    // 2. Videoyu oynatmaya başla
                    zarfVideo.play();
                }
            });

            // Video tamamen bittiğinde...
            zarfVideo.addEventListener("ended", function() {
                // 3. Giriş ekranına yavaşça kaybolma (fade-out) efektini ver
                girisEkrani.classList.add("fade-out");
                
                // 4. Animasyon süresi (1.5s) kadar bekleyip elementi tamamen DOM akışından çıkar
                setTimeout(() => {
                    girisEkrani.style.display = "none";
                }, 1500); 
            });
        });
    </script>

</body>
</html>
